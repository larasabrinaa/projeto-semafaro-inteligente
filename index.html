```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Semáforo Inteligente com Dashboard</title>

    <style>
        /* --- ESTILOS VISUAIS --- */

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f6f7;
            margin-top: 40px;
            color: #333;
        }

        .caixa-semaforo {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .luz {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #1a252f;
            border: 4px solid #111;
            transition: 0.3s;
        }

        .luz.vermelha.ativa {
            background-color: #e74c3c;
            box-shadow: 0 0 30px #e74c3c;
        }

        .luz.amarela.ativa {
            background-color: #f1c40f;
            box-shadow: 0 0 30px #f1c40f;
        }

        .luz.verde.ativa {
            background-color: #2ecc71;
            box-shadow: 0 0 30px #2ecc71;
        }

        /* --- ANIMAÇÃO DO AMARELO PISCANTE --- */

        @keyframes piscar-amarelo {
            0%, 100% {
                background-color: #1a252f;
                box-shadow: none;
            }

            50% {
                background-color: #f1c40f;
                box-shadow: 0 0 30px #f1c40f;
            }
        }

        .luz.amarela.piscante {
            animation: piscar-amarelo 1s infinite;
        }

        #painel-info {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            height: 30px;
            transition: color 0.3s;
        }

        /* --- CONTROLES --- */

        .controles {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #btn-conectar {
            background-color: #8e44ad;
        }

        #btn-conectar:hover {
            background-color: #9b59b6;
        }

        #btn-sensor {
            background-color: #3498db;
        }

        #btn-sensor:hover:not(:disabled) {
            background-color: #2980b9;
        }

        /* --- BOTÃO DE FALHA --- */

        #btn-falha {
            background-color: #e67e22;
        }

        #btn-falha:hover {
            background-color: #d35400;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* --- ESTILOS DO LOG --- */

        .caixa-log {
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .caixa-log h3 {
            background-color: #34495e;
            color: white;
            margin: 0;
            padding: 15px;
            text-align: center;
            font-size: 18px;
        }

        .lista-log {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .lista-log li {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lista-log li:last-child {
            border-bottom: none;
        }

        .lista-log li.novo {
            animation: destacar 1s ease-out;
        }

        @keyframes destacar {
            0% {
                background-color: #d5f5e3;
            }

            100% {
                background-color: transparent;
            }
        }
    </style>
</head>

<body>

    <div class="caixa-semaforo">
        <div class="luz vermelha" id="luz-vermelha"></div>
        <div class="luz amarela" id="luz-amarela"></div>
        <div class="luz verde" id="luz-verde"></div>
    </div>

    <div id="painel-info">
        Sinal Aberto - Siga em frente
    </div>

    <div class="controles">
        <button id="btn-conectar" onclick="conectarArduino()">
            🔌 Conectar ao Arduino
        </button>

        <button id="btn-sensor" onclick="acionarSensor()">
            Simular no Web
        </button>

        <button id="btn-falha" onclick="alternarFalha()">
            ⚠️ Simular Falha
        </button>
    </div>

    <div class="caixa-log">
        <h3>📋 Registro de Eventos</h3>

        <ul class="lista-log" id="historico-log">
            <li style="color: #7f8c8d; font-style: italic;">
                Aguardando atividade...
            </li>
        </ul>
    </div>

    <script>
        const tempoVermelhoTotal = 15;

        let intervaloContador;
        let timeoutAmarelo;
        let timeoutVerde;

        let sensorAtivo = false;
        let modoFalha = false;

        function alterarLuz(corAtiva) {
            document.getElementById('luz-vermelha')
                .classList.remove('ativa');

            document.getElementById('luz-amarela')
                .classList.remove('ativa', 'piscante');

            document.getElementById('luz-verde')
                .classList.remove('ativa');

            if (corAtiva) {
                document.getElementById('luz-' + corAtiva)
                    .classList.add('ativa');
            }
        }

        // --- REGISTRO DE EVENTOS ---

        function registrarNoLog(mensagem) {
            const lista = document.getElementById('historico-log');

            if (
                lista.children.length === 1 &&
                lista.children[0].innerText.includes("Aguardando")
            ) {
                lista.innerHTML = "";
            }

            const agora = new Date();
            const horaFormatada =
                agora.toLocaleTimeString('pt-BR');

            const novoItem = document.createElement('li');

            novoItem.innerHTML =
                `${mensagem} às ${horaFormatada}`;

            novoItem.classList.add('novo');

            lista.prepend(novoItem);
        }

        // --- MODO DE FALHA ---

        function alternarFalha() {
            modoFalha = !modoFalha;

            const btnFalha =
                document.getElementById('btn-falha');

            const btnSensor =
                document.getElementById('btn-sensor');

            const painel =
                document.getElementById('painel-info');

            if (modoFalha) {

                // Interrompe processos em andamento

                clearTimeout(timeoutAmarelo);
                clearTimeout(timeoutVerde);
                clearInterval(intervaloContador);

                sensorAtivo = false;

                // Interface do modo de falha

                btnSensor.disabled = true;

                btnFalha.innerHTML =
                    "✅ Restaurar Semáforo";

                btnFalha.style.backgroundColor =
                    "#27ae60";

                // Apaga as luzes fixas

                alterarLuz('');

                // Inicia amarelo piscante

                document.getElementById('luz-amarela')
                    .classList.add('piscante');

                painel.innerText =
                    "⚠️ SISTEMA INOPERANTE ⚠️";

                painel.style.color =
                    "#e74c3c";

                registrarNoLog(
                    "⚠️ <strong>Falha no sistema:</strong> Amarelo intermitente"
                );

            } else {

                // Restaura o sistema

                btnSensor.disabled = false;

                btnFalha.innerHTML =
                    "⚠️ Simular Falha";

                btnFalha.style.backgroundColor =
                    "#e67e22";

                painel.style.color =
                    "#2c3e50";

                painel.innerText =
                    "Sinal Aberto - Siga em frente";

                alterarLuz('verde');

                registrarNoLog(
                    "✅ <strong>Sistema restaurado:</strong> Operação normal"
                );
            }
        }

        // --- ACIONAMENTO DO SENSOR ---

        function acionarSensor() {

            // Impede ativação durante outra operação
            // ou quando o sistema está em falha

            if (sensorAtivo || modoFalha) {
                return;
            }

            sensorAtivo = true;

            document.getElementById('btn-sensor')
                .disabled = true;

            const painel =
                document.getElementById('painel-info');

            registrarNoLog(
                "🚗 <strong>Objeto detectado</strong>"
            );

            // Muda para amarelo

            alterarLuz('amarela');

            painel.innerText =
                "Atenção! O sinal vai fechar.";

            // Aguarda 7 segundos antes de ficar vermelho

            timeoutAmarelo = setTimeout(() => {

                alterarLuz('vermelha');

                let tempoRestante =
                    tempoVermelhoTotal;

                painel.innerText =
                    `Pare! Tempo restante: ${tempoRestante}s`;

                // Inicia contador

                intervaloContador = setInterval(() => {

                    tempoRestante--;

                    if (tempoRestante > 0) {

                        painel.innerText =
                            `Pare! Tempo restante: ${tempoRestante}s`;

                    } else {

                        clearInterval(intervaloContador);

                        // Volta para o verde

                        alterarLuz('verde');

                        painel.innerText =
                            "Sinal Aberto - Siga em frente";

                        document.getElementById('btn-sensor')
                            .disabled = false;

                        timeoutVerde = setTimeout(() => {
                            sensorAtivo = false;
                        }, 1000);
                    }

                }, 1000);

            }, 7000);
        }

        // --- CONEXÃO COM ARDUINO ---

        let porta;

        async function conectarArduino() {

            if (!("serial" in navigator)) {

                alert(
                    "Seu navegador não suporta leitura USB. " +
                    "Use o Google Chrome ou Edge no PC."
                );

                return;
            }

            try {

                porta =
                    await navigator.serial.requestPort();

                await porta.open({
                    baudRate: 9600
                });

                document.getElementById('btn-conectar')
                    .innerText = "✅ Conectado!";

                document.getElementById('btn-conectar')
                    .style.backgroundColor = "#27ae60";

                lerDadosDoArduino();

            } catch (erro) {

                console.error(
                    "Erro ao conectar:",
                    erro
                );

                alert(
                    "Falha ao conectar. " +
                    "Veja se a porta correta foi escolhida."
                );
            }
        }

        // --- LEITURA DOS DADOS DO ARDUINO ---

        async function lerDadosDoArduino() {

            const leitorTexto =
                new TextDecoderStream();

            const promessaLeitura =
                porta.readable.pipeTo(
                    leitorTexto.writable
                );

            const leitor =
                leitorTexto.readable.getReader();

            let bufferTexto = "";

            while (true) {

                const {
                    value,
                    done
                } = await leitor.read();

                if (done) {

                    leitor.releaseLock();

                    break;
                }

                bufferTexto += value;

                // Só processa a detecção
                // se não estiver em modo de falha

                if (
                    bufferTexto.includes("DETECTADO") &&
                    !modoFalha
                ) {

                    acionarSensor();

                    bufferTexto = "";
                }

                if (bufferTexto.length > 100) {
                    bufferTexto = "";
                }
            }
        }

        // --- INICIALIZA O SEMÁFORO NO VERDE ---

        alterarLuz('verde');
    </script>

</body>
</html>
